version: '3.8'

services:
  # Shared Database Service - Single instance for all environments
  mysql:
    image: mysql:8.0
    container_name: flora-mysql-shared
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - flora-network
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Adminer - Database Management UI for debugging
  adminer:
    image: adminer:latest
    container_name: flora-adminer-shared
    ports:
      - "8888:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=mysql
    depends_on:
      - mysql
    networks:
      - flora-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  flora-network:
    driver: bridge
